name: Okta to Elastic Common Schema
priority: 20

transformations:
  - id: okta_field_mapping
    type: field_name_mapping
    mapping:
      eventtype: event.action
      displaymessage: event.reason
      outcome.result: event.outcome
      actor.alternateId: user.name
      actor.id: user.id
      actor.displayName: user.full_name
      target.alternateId: user.target.name
      client.ipAddress: source.ip
      client.userAgent.rawUserAgent: user_agent.original
      client.geographicalContext.country: source.geo.country_name
      client.geographicalContext.city: source.geo.city_name
      securityContext.asNumber: source.as.number
      securityContext.isProxy: source.as.organization.proxy
      debugContext.debugData.risk: okta.debug_context.debug_data.risk_level
    rule_conditions:
      - type: logsource
        product: okta

  - id: okta_index_condition
    type: add_condition
    conditions:
      'event.dataset': 'okta.system'
    rule_conditions:
      - type: logsource
        product: okta
