name: Validate detections

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sigma:
    name: Sigma
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install toolchain
        run: pip install -r requirements.txt

      - name: Validate rule syntax
        run: sigma check sigma/rules

      - name: Convert Windows rules
        run: |
          sigma convert -t splunk -p splunk_windows sigma/rules/windows
          sigma convert -t lucene -p ecs_windows sigma/rules/windows
          sigma convert -t kusto -p microsoft_xdr sigma/rules/windows

      - name: Convert AWS rules
        run: |
          sigma convert -t splunk --without-pipeline sigma/rules/aws
          sigma convert -t lucene --without-pipeline sigma/rules/aws

      - name: Convert Okta rules
        run: |
          sigma convert -t splunk --without-pipeline sigma/rules/okta
          sigma convert -t lucene -p pipelines/okta_ecs.yml sigma/rules/okta
  yara:
    name: YARA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install YARA
        run: sudo apt-get update && sudo apt-get install -y yara

      - name: Compile all rules
        run: |
          find yara/rules -name '*.yar' -print0 \
            | xargs -0 -r -n1 -I{} yarac {} /tmp/compiled.yarc

      - name: Compile index
        run: yarac yara/index.yar /tmp/index.yarc

      - name: Index must list every rule
        run: |
          find yara/rules -name '*.yar' ! -name 'index.yar' \
            -exec realpath -m --relative-to=. {} \; \
            | sort -u > /tmp/on-disk.txt

          sed -n 's|^[[:space:]]*include[[:space:]]*"\([^"]*\)".*|yara/\1|p' yara/index.yar \
            | xargs -r -n1 realpath -m --relative-to=. \
            | sort -u > /tmp/in-index.txt

          missing=$(comm -23 /tmp/on-disk.txt /tmp/in-index.txt)
          stale=$(comm -13 /tmp/on-disk.txt /tmp/in-index.txt)

          if [ -n "$missing" ]; then
            echo "Rules on disk but missing from yara/index.yar:"
            echo "$missing" | sed 's/^/  /'
          fi

          if [ -n "$stale" ]; then
            echo "yara/index.yar includes files that do not exist:"
            echo "$stale" | sed 's/^/  /'
          fi

          if [ -n "$missing$stale" ]; then
            echo
            echo "Add an include line for each missing rule, or drop the stale ones."
            exit 1
          fi

          echo "index lists all $(wc -l < /tmp/on-disk.txt) rule(s)"

      - name: True positive must match
        run: |
          for rule in $(find yara/rules -name '*.yar'); do
            total=0
            for sample in tests/logs/*; do
              [ -f "$sample" ] || continue
              count=$(yara "$rule" "$sample" -c)
              total=$((total + count))
            done
            echo "$rule matched $total sample(s)"
            test "$total" -gt 0
          done

      - name: False positive must not match
        run: |
          for rule in $(find yara/rules -name '*.yar'); do
            for sample in tests/goodware/*; do
              [ -f "$sample" ] || continue
              count=$(yara "$rule" "$sample" -c)
              test "$count" -eq 0 || { echo "FP: $rule matched $sample"; exit 1; }
            done
          done
