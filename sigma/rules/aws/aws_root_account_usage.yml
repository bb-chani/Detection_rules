title: AWS Root Account Usage
id: 85386a1b-3ca4-47ea-a7ad-beec05bd0c55
status: experimental
description: |
    Detects API activity performed by the AWS account root user. Root credentials
    should be secured after initial account setup and used only for the few tasks
    that require them, so routine root activity indicates either poor hygiene or a
    compromised credential.
references:
    - https://docs.aws.amazon.com/IAM/latest/UserGuide/id_root-user.html
    - https://attack.mitre.org/techniques/T1078/004/
author: bb-chani
date: 2026-09-16
tags:
    - attack.privilege-escalation
    - attack.t1078.004
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        userIdentity.type: 'Root'
    filter_service_event:
        eventType: 'AwsServiceEvent'
    condition: selection and not filter_service_event
falsepositives:
    - Account setup and billing tasks that genuinely require root
    - Support cases requiring root authentication
level: high
