repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: '^(\.venv/|requirements\.txt$)'

  - repo: local
    hooks:
      - id: sigma-check
        name: sigma check
        entry: sigma check
        language: system
        files: ^sigma/rules.*\.ya?ml$
        pass_filenames: false
        args: ['sigma/rules']

      - id: yara-compile
        name: yara compile
        entry: python3 -c "import yara,sys,glob; [yara.compile(filepath=f) for f in glob.glob('yara/rules/**/*.yar', recursive=True)]"
        language: system
        files: ^yara/rules/.*\.yar$
        pass_filenames: false
